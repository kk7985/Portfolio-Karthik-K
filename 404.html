<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Redirecting&hellip;</title>
<script>
  // GitHub Pages serves this file for any path it doesn't recognize
  // (e.g. a refresh on /projects or a direct link to /project/ecommerce).
  // We stash the URL the visitor actually wanted, then send them to the
  // site root. index.html's own script reads sessionStorage.redirect
  // and restores that path via history.replaceState, so the SPA router
  // picks up right where it should.
  sessionStorage.redirect = location.href;

  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var isGithubIoProjectSite = location.hostname.indexOf('github.io') !== -1 && parts.length > 0;
    var base = isGithubIoProjectSite ? ('/' + parts[0] + '/') : '/';
    location.replace(location.origin + base);
  })();
</script>
</head>
<body></body>
</html>
